      - "4000:443"
    # healthcheck:
    #   test: ["CMD", "curl", "-f", "<http://localhost:4000/health>"]
    #   interval: 30s
    #   timeout: 10s
    #   retries: 5
    environment:
      DEPLOY_TYPE1: development
      DEPLOY_TYPE2: production
    
    env_file:
      - .env
